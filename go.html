<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Opening article…</title>
<style>
html, body { margin: 0; height: 100%; background: #F4F4F2; color: #5D6B7E; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { html, body { background: #111315; color: #98A2B3; } }
p { margin: 0; padding: 40vh 24px 0; text-align: center; }
a { color: inherit; }
</style>
</head>
<body>
<p id="msg">Opening article…</p>
<script>
// A notification opens this small page instead of the full app, so a slow connection only has to load
// about a kilobyte before the article starts opening. It notes the story as seen, finds the article's
// address (from what the app already saved on this phone, else from a small lookup file), and goes there.
(function () {
  "use strict";
  var SEEN_TOPIC = "news-seen-57d844c41359b1b3";
  var LOOKUPS = [
    { url: "https://api.github.com/repos/ethanlaneday/news-alerts/contents/go.json?ref=news-data", headers: { "Accept": "application/vnd.github.raw+json" } },
    { url: "https://raw.githubusercontent.com/ethanlaneday/news-alerts/news-data/go.json", headers: {} }
  ];
  var id = (location.search.match(/[?&]go=([0-9a-f]{16})(?:&|$)/) || [])[1];
  function app() { location.replace("./" + (id ? "?go=" + id : "")); }   // the full page knows how to finish the job
  function ok(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }
  if (!id) return app();

  // Note it as seen without waiting for the answer.
  try { var t = JSON.parse(localStorage.getItem("news.tapped") || "{}"); t[id] = 1; localStorage.setItem("news.tapped", JSON.stringify(t)); } catch (e) {}
  try {
    if (!(navigator.sendBeacon && navigator.sendBeacon("https://ntfy.sh/" + SEEN_TOPIC, "seen:" + id)))
      fetch("https://ntfy.sh/" + SEEN_TOPIC, { method: "POST", body: "seen:" + id, keepalive: true }).catch(function () {});
  } catch (e) {}

  var saved = null;
  try { saved = ok((JSON.parse(localStorage.getItem("news.links") || "{}"))[id]); } catch (e) {}
  if (saved) return location.replace(saved);

  var tries = 0;
  function look(n) {
    var src = LOOKUPS[n], ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
    return fetch(src.url + (src.url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store", headers: src.headers, signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) { var e = d[id]; var link = ok(Array.isArray(e) ? e[0] : e); if (!link) throw new Error("not listed"); return link; })
      .catch(function (e) { clearTimeout(timer); if (n + 1 < LOOKUPS.length) return look(n + 1); throw e; });
  }
  (function attempt() {
    look(0).then(function (link) { location.replace(link); }).catch(function () {
      // The lookup is published a few seconds after the alert is sent: try again briefly, then hand over to the app.
      if (++tries < 3) return setTimeout(attempt, 1500);
      app();
    });
  })();
  setTimeout(function () {
    var m = document.getElementById("msg"); m.textContent = "Still opening… ";
    var a = document.createElement("a"); a.href = "./?go=" + id; a.textContent = "open the news page instead"; m.appendChild(a);
  }, 5000);
})();
</script>
</body>
</html>
