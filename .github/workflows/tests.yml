name: Tests

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["README.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: The page's script parses
        run: python3 tests/extract_script.py index.html > /tmp/page.js && node --check /tmp/page.js
