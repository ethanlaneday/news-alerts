name: Health check

# Watches the news job from outside: restarts it if it has gone quiet, and alerts if it stays quiet.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to restart the news job

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-
      - name: Check the news job is alive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 tools/health.py
      - uses: actions/cache/save@v4
        if: success()
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
