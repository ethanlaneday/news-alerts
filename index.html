<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>News alerts</title>
<meta name="description" content="Association news, sorted by importance.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #F4F4F2; --card: #FFFFFF; --line: #E4E4E0; --text: #101828; --body: #344054; --muted: #5D6B7E;
  --chip-on-bg: #1D2939; --chip-on-fg: #FFFFFF; --chip-line: #D0D5DD;
  --crit: #D92D20; --high: #B54708; --note: #475467; --fyi: #5D6B7E; --unread: #2563EB;
  --cada: #C8102E; --heal: #0F766E; --on-assoc: #FFFFFF; --cada-text: #A50E26; --heal-text: #0B5F58;
  --rvda: #4D7C0F; --rvda-text: #3F6212; --hrai: #3730A3; --hrai-text: #3730A3; --ida: #BE185D; --ida-text: #9D174D;
  --p5-bg: #D92D20; --p5-fg: #FFFFFF; --p4-bg: #FEF0C7; --p4-fg: #93370D; --p3-bg: #EAECF0; --p3-fg: #344054; --p2-fg: #5D6B7E;
  --soft: #F4F4F2; --foot: #FAFAF8;
  --o5: #D92D20; --o4: #DC6803; --o3: #98A2B3; --o2: #E4E4E0;
  --new-line: #93C5FD; --new-bg: #2563EB; --new-fg: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111315; --card: #1A1D21; --line: #2A2F35; --text: #F2F4F7; --body: #D0D5DD; --muted: #98A2B3;
    --chip-on-bg: #F2F4F7; --chip-on-fg: #111315; --chip-line: #3A4049;
    --crit: #F97066; --high: #FDB022; --note: #B9C0CB; --fyi: #98A2B3; --unread: #60A5FA;
    --cada: #C8102E; --heal: #0F766E; --on-assoc: #FFFFFF; --cada-text: #FF7A8C; --heal-text: #2DD4BF;
    --rvda: #4D7C0F; --rvda-text: #A3E635; --hrai: #4F46E5; --hrai-text: #A5B4FC; --ida: #BE185D; --ida-text: #F9A8D4;
    --p5-bg: #D92D20; --p5-fg: #FFFFFF; --p4-bg: #7A2E0E; --p4-fg: #FEF0C7; --p3-bg: #2A2F35; --p3-fg: #D0D5DD; --p2-fg: #98A2B3;
    --soft: #23272C; --foot: #1F2327;
    --o5: #F04438; --o4: #FDB022; --o3: #667085; --o2: #2A2F35;
    --new-line: #1D4ED8; --new-bg: #3B82F6; --new-fg: #0B1220;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 760px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); }
header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.meta { margin: 0; font-size: 13px; color: var(--muted); }
.meta strong { color: var(--text); }
@keyframes spin { to { transform: rotate(360deg); } }
/* Pull down from the top of the page to refresh. */
html { overscroll-behavior-y: contain; }
.ptr { position: fixed; z-index: 20; left: 50%; top: calc(env(safe-area-inset-top) + 10px); width: 40px; height: 40px; margin-left: -20px;
  border-radius: 999px; background: var(--card); border: 1px solid var(--chip-line); box-shadow: 0 2px 8px rgba(16,24,40,0.16);
  display: grid; place-items: center; color: var(--muted); opacity: 0; transform: translateY(-70px); pointer-events: none; }
.ptr.settle { transition: transform .2s ease, opacity .2s ease; }
.ptr svg { width: 20px; height: 20px; }
.ptr.ready { color: var(--unread); } .ptr.spin svg { animation: spin .8s linear infinite; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--chip-line);
  background: var(--card); color: var(--body); font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); border-color: var(--chip-on-bg); color: var(--chip-on-fg); font-weight: 600; }
.brief { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; }
.brief h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); }
.brief p { margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: var(--body); }
.brief.clamped p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.brief .link-btn { min-height: 36px; margin-top: 2px; }
.tag { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: var(--on-assoc); }
/* Each association has one colour (--ac) and a text shade of it (--at); everything below reads those. */
.CADA, .a-CADA { --ac: var(--cada); --at: var(--cada-text); } .HEAL, .a-HEAL { --ac: var(--heal); --at: var(--heal-text); }
.RVDA, .a-RVDA { --ac: var(--rvda); --at: var(--rvda-text); } .HRAI, .a-HRAI { --ac: var(--hrai); --at: var(--hrai-text); }
.IDA, .a-IDA { --ac: var(--ida); --at: var(--ida-text); }
.BOTH, .a-BOTH, .a- { --ac: var(--note); --at: var(--muted); }
.tag { background: var(--ac, var(--note)); }
.chip.assoc[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: var(--on-assoc); }
section.level { margin-bottom: 20px; }
.lvl-head { display: flex; align-items: center; gap: 8px; margin: 0 4px 8px; }
.lvl-head .dot { width: 10px; height: 10px; border-radius: 999px; }
.lvl-head h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
.lvl-head .count { font-size: 12px; color: var(--muted); }
.cards { display: flex; flex-direction: column; gap: 10px; }
/* ---- Filters, folded away until needed ---- */
.filter-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 12px;
  border: 1px solid var(--chip-line); background: var(--card); color: var(--text); font: 600 14px inherit; font-family: inherit; cursor: pointer; text-align: left; }
.filter-btn svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.filter-btn .now { flex: 1; min-width: 0; font-weight: 400; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filter-btn .chev { transition: transform .15s ease; } .filter-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.filters { display: flex; flex-direction: column; gap: 10px; } .filters[hidden] { display: none; }
/* ---- News / Parliament switch ---- */
.tabs { display: flex; padding: 4px; border-radius: 12px; background: var(--line); }
.tabs button { flex: 1; min-height: 40px; border: none; border-radius: 9px; background: transparent; color: var(--muted);
  font: 600 14px inherit; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tabs button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,0.14); }
.tabs .n { padding: 1px 7px; border-radius: 999px; background: var(--new-bg); color: var(--new-fg); font-size: 11px; font-weight: 700; }
body.parl .news-only { display: none !important; }
/* ---- Parliament view ---- */
.p-sec { margin-bottom: 24px; }
.p-head { display: flex; align-items: baseline; gap: 8px; margin: 0 4px 10px; }
.p-head h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
.p-head span { font-size: 12px; color: var(--muted); }
.p-day { margin: 14px 4px 8px; font-size: 13px; font-weight: 700; } .p-day:first-child { margin-top: 0; }
.p-card { position: relative; background: var(--card); border: 2px solid var(--o2); border-radius: 16px; overflow: hidden;
  padding: 14px 16px 14px 23px; display: flex; flex-direction: column; gap: 9px; }
.p-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--note); }
.p-card::before { background: var(--ac, var(--note)); }
.p-card.hot { border-color: var(--o4); }
.p-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.p-who { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.p-who b { font-size: 14px; font-weight: 800; letter-spacing: 0.07em; color: var(--muted); }
.p-who b { color: var(--at, var(--muted)); }
.p-code { padding: 2px 7px; border-radius: 6px; background: var(--chip-on-bg); color: var(--chip-on-fg); font-size: 12px; font-weight: 700; }
.p-time { flex: none; font-size: 13px; font-weight: 600; }
.p-title { font-size: 17px; font-weight: 600; line-height: 1.28; color: var(--text); text-decoration: none; }
.p-why { font-size: 14px; line-height: 1.42; color: var(--body); }
.p-sub { font-size: 13px; color: var(--muted); line-height: 1.4; }
.p-note { align-self: flex-start; padding: 3px 9px; border-radius: 999px; background: var(--p4-bg); color: var(--p4-fg); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
.p-agenda { margin: 0; padding: 0 0 0 16px; font-size: 13px; line-height: 1.45; color: var(--body); }
.p-links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; font-weight: 600; }
.p-links a, .p-links button { color: var(--unread); text-decoration: none; border: none; background: none; padding: 0; font: inherit; cursor: pointer; min-height: 28px; }
.trk { display: flex; gap: 3px; } .trk span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.trk span.gap { margin-left: 8px; } .trk span.on { background: var(--note); }
.trk span.on { background: var(--ac, var(--note)); }
.trk-l { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
.p-stage { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.p-stage b { font-weight: 600; } .p-stage span { flex: none; color: var(--muted); }
.p-list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; list-style: none; margin: 0; }
.p-list li { display: flex; gap: 11px; padding: 13px 0; border-top: 1px solid var(--line); } .p-list li:first-child { border-top: none; }
.p-list .bar { flex: none; width: 4px; border-radius: 2px; background: var(--note); }
.p-list .bar { background: var(--ac, var(--note)); }
.p-list .txt { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.p-list .mrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.p-list .m { font-size: 12px; color: var(--muted); } .p-list .m .n { color: var(--unread); font-weight: 700; }
.p-list .m b { color: var(--at, var(--muted)); }
.p-list .w { font-size: 14px; font-weight: 600; } .p-list .w span { font-weight: 400; color: var(--muted); }
.p-list a.w { color: var(--text); text-decoration: none; line-height: 1.35; }
.p-list span.q { font-size: 13px; line-height: 1.4; color: var(--body); }
.p-list a.q { font-size: 14px; line-height: 1.42; color: var(--body); text-decoration: none; }
.p-list mark { background: var(--p4-bg); color: var(--p4-fg); padding: 0 2px; border-radius: 3px; }
/* ---- story cards ---- */
article.card { position: relative; padding: 0 0 0 7px; gap: 0; border-radius: 16px; overflow: hidden; border: 2px solid var(--o2); }
/* Left rail = which association. Outline = how important: red critical, amber high, grey notable. */
article.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; }
article.card::before { background: var(--ac, var(--note)); }
article.card.lv5 { border-color: var(--o5); } article.card.lv4 { border-color: var(--o4); }
article.card.lv3 { border-color: var(--o3); } article.card.lv2 { border-color: var(--o2); }
article.card.unseen { border-color: var(--o2); }
article.card.unseen.lv5 { border-color: var(--o5); } article.card.unseen.lv4 { border-color: var(--o4); }
article.card.unseen.lv3 { border-color: var(--o3); }
.card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card-top .col { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
.card-top .left { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.card-top .right { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.kicker-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 20px; }
.newpill { transition: opacity .25s ease; } .newpill.gone { opacity: 0; }
.lvl { flex: none; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
.lvl.l5 { background: var(--p5-bg); color: var(--p5-fg); } .lvl.l4 { background: var(--p4-bg); color: var(--p4-fg); }
.lvl.l3 { background: var(--p3-bg); color: var(--p3-fg); } .lvl.l2 { color: var(--p2-fg); box-shadow: inset 0 0 0 1px var(--line); }
.outlet { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; color: var(--muted); }
.outlet b { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outlet .age { flex: none; }
.oi { position: relative; flex: none; display: grid; place-items: center; border-radius: 6px; overflow: hidden;
  color: #FFFFFF; font-weight: 700; line-height: 1; }
/* Hidden with opacity, not display:none, so the browser still fetches it. */
.oi img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #FFFFFF; opacity: 0; }
.oi.has-img img { opacity: 1; }
.card .headline a, .card .headline .t { font-size: 18px; font-weight: 600; line-height: 1.28; letter-spacing: -0.01em; color: var(--text); text-decoration: none; }
.whybox { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.whybox span:first-child { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
.whybox span:last-child { font-size: 13px; line-height: 1.4; color: var(--text); }
.thread-bar { width: 100%; min-height: 52px; padding: 0 16px; border: none; border-top: 1px solid var(--line); background: var(--foot);
  display: flex; align-items: center; gap: 10px; font-family: inherit; cursor: pointer; text-align: left; color: var(--text); }
.thread-bar .label { flex: 1; font-size: 14px; font-weight: 600; }
.thread-bar .stack { display: flex; } .thread-bar .stack .oi { box-shadow: 0 0 0 2px var(--foot); } .thread-bar .stack .oi + .oi { margin-left: -6px; }
.thread-bar svg, .more-bar svg { flex: none; width: 16px; height: 16px; color: var(--muted); }
.badge-new { flex: none; padding: 2px 8px; border-radius: 999px; background: var(--new-bg); color: var(--new-fg); font-size: 11px; font-weight: 700; }
ul.rows { list-style: none; margin: 0; padding: 0 16px; background: var(--foot); }
ul.rows li { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
ul.rows .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
ul.rows a, ul.rows .t { font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--text); text-decoration: none; }
ul.rows li.seen a, ul.rows li.seen .t { font-weight: 500; color: var(--body); }
ul.rows .m, ol.tl .m { font-size: 12px; color: var(--muted); } .m .n { color: var(--unread); font-weight: 700; }
/* big ongoing story */
.story-head { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.story-head .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.story-head .who { display: flex; align-items: baseline; gap: 7px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.story-head .who b { font-size: 14px; font-weight: 800; letter-spacing: 0.07em; }
.story-head .who b { color: var(--at, var(--muted)); }
.story-head h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.22; letter-spacing: -0.01em; }
.story-head p { margin: 0; font-size: 13px; color: var(--muted); }
.keys-wrap { padding: 14px 16px 6px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
ol.keys { list-style: none; margin: 0; padding: 0; }
ol.keys li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; padding: 7px 0; }
ol.keys li.part { display: block; padding: 8px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); }
ol.keys .when { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 2px; }
ol.keys .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
ol.keys .t { font-size: 14px; font-weight: 600; line-height: 1.38; color: var(--text); }
ol.keys .m { font-size: 12px; color: var(--muted); } ol.keys .m a { color: var(--muted); }
ol.keys .prov { font-size: 11px; letter-spacing: 0.04em; color: var(--high); }
.keys-wrap .link-btn { align-self: flex-start; min-height: 36px; }
.story-head { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ongoing { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--unread); margin-bottom: -2px; }
.strip-wrap { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.strip { display: flex; align-items: center; }
.strip .d { flex: none; width: 9px; height: 9px; border-radius: 999px; background: var(--chip-line); }
.strip .d.on { background: var(--ac, var(--note)); }
.strip .ln { flex: 1; height: 2px; background: var(--line); }
.strip-l { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
article.card.folded .story-head { padding-bottom: 10px; }
.story-head .row1-r { display: flex; align-items: center; gap: 8px; flex: none; }
.story-head .row1-r svg { width: 18px; height: 18px; color: var(--muted); }
article.card.folded .story-head { border-bottom: none; padding-bottom: 6px; }
.fold-body { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.fold-stands { margin: 0; font-size: 14px; line-height: 1.42; color: var(--body);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.fold-body ol.keys li { padding: 4px 0; }
.fold-bar { min-height: 44px; }
ul.rows.fold-rows { padding: 0; background: transparent; } ul.rows.fold-rows li:first-child { border-top: none; padding-top: 2px; }
/* "Ask Claude": a small round button tucked into the bottom-right corner of the card's text. */
.card-body, .fold-body { position: relative; }
.ask-row { height: 0; margin: -9px 0 0; }
.fold-body .ask-row { margin-top: -8px; }
.ask { position: absolute; right: 12px; bottom: 10px; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center;
  border: 1px solid var(--chip-line); background: var(--card); box-shadow: 0 1px 2px rgba(16,24,40,0.10); }
.ask svg { width: 19px; height: 19px; color: #D97757; }
/* The last line of text keeps clear of the button. */
.card-body > :nth-last-child(2), .fold-body > :nth-last-child(2) { padding-right: 44px; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
.kicker .n { color: var(--unread); }
.tl-wrap { padding: 2px 16px 4px; border-top: 1px solid var(--line); }
.tl-wrap .kicker { display: block; margin: 12px 0 2px; }
ol.tl { list-style: none; margin: 0; padding: 0; }
ol.tl li { display: grid; grid-template-columns: 38px 14px minmax(0, 1fr); gap: 8px; padding: 9px 0; }
ol.tl .when { font-size: 12px; color: var(--muted); padding-top: 2px; }
ol.tl .rail { display: flex; flex-direction: column; align-items: center; }
ol.tl .dot { width: 10px; height: 10px; margin-top: 5px; border-radius: 999px; background: var(--text); }
ol.tl .dot.hollow { background: var(--card); box-shadow: inset 0 0 0 2px var(--muted); }
ol.tl .line { flex: 1; width: 2px; margin-top: 4px; background: var(--line); }
ol.tl li:last-child .line { display: none; }
ol.tl .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

      }
      throw new Error("not published yet");
    }).catch(function () {
      // The story is published a few seconds after its alert; retry briefly, then show the page.
      if (++tries < 5) return setTimeout(find, 2000);
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
      state.query = ""; refresh();
    });
  })();
})();
</script>
